{% extends "base.html" %}
{% block content %}
<div class="py-3" style="max-width:780px">
  <h3>Edit Student</h3>
  <form method="post" class="card p-3">
    <div class="mb-2">
      <label class="form-label">USN</label>
      <input name="usn" class="form-control" value="{{ student.usn }}" required>
    </div>
    <div class="mb-2">
      <label class="form-label">Full name</label>
      <input name="display_name" class="form-control" value="{{ student.display_name }}" required>
    </div>
    <div class="mb-2">
      <label class="form-label">Semester</label>
      <select name="semester" class="form-select">
        <option value="">-- none --</option>
        {% for sem in semesters %}
          <option value="{{ sem['semester'] }}" {% if student.semester==sem['semester'] %}selected{% endif %}>{{ sem['semester'] }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">Save</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('page_students') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
